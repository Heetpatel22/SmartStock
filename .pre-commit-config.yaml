# Pre-commit configuration for SmartStock
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: pytest-check
        name: Run Pytest Suite
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

