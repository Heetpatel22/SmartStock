services:
  - type: web
    name: smartstock
    runtime: python
    plan: free
    buildCommand: chmod +x render_build.sh && ./render_build.sh
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FLASK_APP
        value: run.py
