{% extends "base.html" %}
{% block title %}Sign In · SmartStock{% endblock %}
{% block content %}
<div class="auth-card card shadow mx-auto">
    <div class="card-body p-4 p-md-5">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-box-seam-fill"></i>
            </div>
            <h1 class="h3 fw-bold text-dark mb-1">Welcome Back</h1>
            <p class="text-muted small">Sign in to your SmartStock workspace</p>
        </div>

        <!-- Demo credentials helper banner -->
        <div class="alert alert-info py-2 px-3 small d-flex align-items-center mb-4" style="border-radius: 8px;">
            <i class="bi bi-info-circle-fill me-2 fs-6"></i>
            <div>
                <strong>Demo Admin</strong>: <code>admin@smartstock.local</code> / <code>Admin123!</code>
            </div>
        </div>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input class="form-control" type="email" name="email" placeholder="name@company.com" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label mb-0">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input class="form-control" type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <button class="btn btn-primary w-100 py-2 fs-6 d-inline-flex justify-content-center align-items-center gap-2">
                <i class="bi bi-box-arrow-in-right"></i>
                <span>Sign In</span>
            </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <p class="text-muted small mb-0">
                New staff member? <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold text-decoration-none">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
