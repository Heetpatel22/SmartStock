{% extends "base.html" %}
{% block title %}Login · SmartStock{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto">
    <div class="card-body p-4">
        <h1 class="h3 mb-3">Sign in</h1>
        <p class="text-muted">Access inventory, sales, and reports.</p>
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" name="email" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-3 mb-0">No account? <a href="{{ url_for('auth.register') }}">Register</a></p>
    </div>
</div>
{% endblock %}
