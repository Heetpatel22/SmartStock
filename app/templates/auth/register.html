{% extends "base.html" %}
{% block title %}Register · SmartStock{% endblock %}
{% block content %}
<div class="auth-card card shadow mx-auto">
    <div class="card-body p-4 p-md-5">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h1 class="h3 fw-bold text-dark mb-1">Create Account</h1>
            <p class="text-muted small">Register as a cashier or administrator</p>
        </div>

        <form method="post">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted">
                        <i class="bi bi-person"></i>
                    </span>
                    <input class="form-control" name="name" placeholder="John Doe" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input class="form-control" type="email" name="email" placeholder="name@company.com" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white text-muted">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input class="form-control" type="password" name="password" minlength="8" placeholder="Minimum 8 characters" required>
                </div>
            </div>
            <button class="btn btn-primary w-100 py-2 fs-6 d-inline-flex justify-content-center align-items-center gap-2">
                <i class="bi bi-check-lg"></i>
                <span>Complete Registration</span>
            </button>
        </form>

        <div class="text-center mt-4 pt-2 border-top">
            <p class="text-muted small mb-0">
                Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
