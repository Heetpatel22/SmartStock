{% extends "base.html" %}
{% block title %}Register · SmartStock{% endblock %}
{% block content %}
<div class="auth-card card shadow-sm mx-auto">
    <div class="card-body p-4">
        <h1 class="h3 mb-3">Create account</h1>
        <p class="text-muted">The first registered account becomes the administrator.</p>
        <form method="post">
            <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" required></div>
            <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
            <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div>
            <button class="btn btn-primary w-100">Register</button>
        </form>
        <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
</div>
{% endblock %}
